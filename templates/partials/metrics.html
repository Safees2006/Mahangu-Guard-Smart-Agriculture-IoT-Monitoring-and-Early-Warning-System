{% if page == 'sensors' %}
<article class="panel metric"><div class="metric-top"><span class="round-icon amber" data-icon="temperature"></span><span>Temperature</span></div><div class="metric-bottom"><div class="metric-value"><span id="temperature-value">—</span><small>°C</small></div><span class="metric-hint">Ambient<br><strong>temperature</strong></span></div></article>
{% endif %}
          <article class="panel metric"><div class="metric-top"><span class="round-icon green" data-icon="drop"></span><span>Soil moisture</span></div><div class="metric-bottom"><div class="metric-value"><span id="moisture-value">—</span><small>%</small></div><span class="metric-hint">Demo band<br><strong>30–85%</strong></span></div><div class="meter"><span id="moisture-meter"></span></div></article>
