<section id="history" class="panel history-panel section-anchor"><div class="panel-heading"><div><h2>Reading history</h2><p>Trace each sample back to its source</p></div><div class="history-actions"><button class="btn btn-outline-secondary button button-light" id="refresh" type="button"><span data-icon="refresh"></span>Refresh</button><button id="toggle-history" class="text-button" type="button">View all <span>›</span></button></div></div><label class="history-search"><span data-icon="search"></span><input id="history-filter" type="search" class="form-control form-control-sm" placeholder="Filter by sample, time, source or warning" aria-label="Filter reading history" value="{{ search_query }}"></label><div class="table-scroll"><table><caption class="visually-hidden">Recent sensor readings stored in SQLite</caption><thead><tr><th scope="col">Sample / time</th><th scope="col">Moisture</th><th scope="col">Temp.</th><th scope="col">pH</th><th scope="col">Light</th><th scope="col">Alkalinity</th><th scope="col">Source</th><th scope="col">Warnings</th></tr></thead><tbody id="history-body"><tr><td colspan="8" class="empty-cell">No samples recorded yet.</td></tr></tbody></table></div><div class="table-footer"><span id="history-summary">No recorded samples</span><span><i class="live-dot"></i>Local sensor history</span></div></section>
